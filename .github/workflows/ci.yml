name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ZenVizor.slnx

      - name: Build
        run: dotnet build ZenVizor.slnx --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test ZenVizor.slnx
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx

      - name: Pack build outputs
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/binaries | Out-Null
          Get-ChildItem -Path src -Recurse -Directory -Filter "net10.0-windows" |
              Where-Object { $_.FullName -match "\\bin\\${{ env.CONFIGURATION }}\\" } |
              ForEach-Object {
                  $project = $_.Parent.Parent.Parent.Name
                  Copy-Item -Recurse -Force $_.FullName "artifacts/binaries/$project"
              }

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: artifacts/binaries

      # Installer (Phase 6.8a). Pinned to WiX 6.0.1 — the last MIT-licensed
      # release. v7+ requires the OSMF EULA; do not upgrade past 6.x without
      # revisiting the licensing posture.
      - name: Install WiX 6.0.1 toolset
        if: success()
        run: |
          dotnet tool install --global wix --version 6.0.1
          wix extension add --global WixToolset.Util.wixext/6.0.1

      - name: Build installer (MSI)
        if: success()
        run: >
          dotnet build installer/ZenVizor.wixproj
          --configuration ${{ env.CONFIGURATION }}

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/bin/x64/${{ env.CONFIGURATION }}/ZenVizor.msi
