name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (pinned by global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ZenVizor.slnx

      - name: Build
        run: dotnet build ZenVizor.slnx --configuration ${{ env.CONFIGURATION }} --no-restore

      # Phase 9.1 regression guard — assert no non-win-x64 RID folder reappears
      # under any runtimes\ in the three RID-pinned projects (Service, UI, CLI).
      # Today the runtimes\ folders don't exist at all (natives are flat at the
      # bin root); guard against (a) a future package whose layout adds a
      # runtimes\<rid>\ tree containing the wrong RID, and (b) accidental
      # removal of <RuntimeIdentifier>win-x64</RuntimeIdentifier> from one
      # of the csprojs. win-x64 itself is allowed; everything else fails CI.
      - name: Guard against non-win-x64 RID asset bloat
        if: success()
        shell: pwsh
        run: |
          $projects = @('ZenVizor.Service', 'ZenVizor.Ui', 'ZenVizor.Cli')
          $bad = @()
          foreach ($p in $projects) {
              $runtimes = "src/$p/bin/${{ env.CONFIGURATION }}/net10.0-windows/runtimes"
              if (Test-Path $runtimes) {
                  Get-ChildItem -Path $runtimes -Directory |
                      Where-Object { $_.Name -ne 'win-x64' } |
                      ForEach-Object { $bad += "$p :: runtimes/$($_.Name)" }
              }
          }
          if ($bad.Count -gt 0) {
              Write-Error ("Phase 9.1 RID guard failed — non-win-x64 RID folder(s) detected:`n" + ($bad -join "`n"))
              exit 1
          }
          Write-Host "Phase 9.1 RID guard passed — no non-win-x64 runtime asset folders present."

      - name: Test
        run: >
          dotnet test ZenVizor.slnx
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx

      - name: Pack build outputs
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/binaries | Out-Null
          Get-ChildItem -Path src -Recurse -Directory -Filter "net10.0-windows" |
              Where-Object { $_.FullName -match "\\bin\\${{ env.CONFIGURATION }}\\" } |
              ForEach-Object {
                  $project = $_.Parent.Parent.Parent.Name
                  Copy-Item -Recurse -Force $_.FullName "artifacts/binaries/$project"
              }

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: artifacts/binaries

      # Installer (Phase 6.8a + Phase 7). Pinned to WiX 6.0.1 across SDK,
      # Util, Bal, NetFx. All four ship under the Open Source Maintenance
      # Fee Agreement; source code stays MS-RL (OSI-approved). The fee
      # applies only to revenue-generating use, which ZenVizor is not.
      # See Directory.Packages.props (Installer (WiX) group) for the
      # full rationale. Util is needed by the MSI; Bal + NetFx by the
      # Phase 7 Burn bundle.
      - name: Install WiX 6.0.1 toolset
        if: success()
        run: |
          dotnet tool install --global wix --version 6.0.1
          wix extension add --global WixToolset.Util.wixext/6.0.1
          wix extension add --global WixToolset.Bal.wixext/6.0.1
          wix extension add --global WixToolset.NetFx.wixext/6.0.1

      - name: Build installer (MSI)
        if: success()
        run: >
          dotnet build installer/ZenVizor.wixproj
          --configuration ${{ env.CONFIGURATION }}

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: installer/bin/x64/${{ env.CONFIGURATION }}/ZenVizor.msi

      # Phase 7 — Burn bootstrapper bundle. Fetches the .NET 10 Desktop
      # Runtime EXE at build time (FetchDotnetRuntimePayload target inside
      # the wixproj) and embeds it alongside the MSI, producing
      # ZenVizorSetup.exe as the canonical install artifact.
      - name: Build installer bundle (ZenVizorSetup.exe)
        if: success()
        run: >
          dotnet build installer/Bundle/ZenVizor.Bundle.wixproj
          --configuration ${{ env.CONFIGURATION }}

      - name: Upload bundle artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: installer/Bundle/bin/x64/${{ env.CONFIGURATION }}/ZenVizorSetup.exe
